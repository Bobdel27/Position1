<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Géolocalisation</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  :root{
    --blue:#2563eb;
    --blue-dark:#1d4ed8;
    --red:#dc2626;
    --red-dark:#b91c1c;
    --green:#16a34a;
    --green-dark:#15803d;
    --yellow:#ca8a04;
    --yellow-dark:#a16207;
    --orange:#ea580c;
    --orange-dark:#c2410c;
    --bg:#0a0a0a;
    --panel:#141414;
    --text:#e5e5e5;
    --muted:#9ca3af;
    --border:#2a2a2a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background-color:var(--bg);
    background-image:
      repeating-linear-gradient(45deg, #1c1c1c 0px, #1c1c1c 4px, #0a0a0a 4px, #0a0a0a 8px),
      repeating-linear-gradient(-45deg, #1c1c1c 0px, #1c1c1c 4px, #0a0a0a 4px, #0a0a0a 8px);
    background-blend-mode:multiply;
    color:var(--text);
  }
  #app{
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
  }
  header{
    padding:14px 16px 10px;
    background:var(--panel);
    background-image:
      repeating-linear-gradient(45deg, #202020 0px, #202020 3px, #141414 3px, #141414 6px),
      repeating-linear-gradient(-45deg, #202020 0px, #202020 3px, #141414 3px, #141414 6px);
    background-blend-mode:multiply;
    border-bottom:1px solid var(--border);
  }
  header h1{
    margin:0;
    font-size:18px;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  #status{
    font-size:12.5px;
    color:var(--muted);
    margin-top:3px;
    min-height:16px;
  }
  #controls{
    background:var(--panel);
    background-image:
      repeating-linear-gradient(45deg, #202020 0px, #202020 3px, #141414 3px, #141414 6px),
      repeating-linear-gradient(-45deg, #202020 0px, #202020 3px, #141414 3px, #141414 6px);
    background-blend-mode:multiply;
    padding:10px 16px 12px;
    border:2px solid var(--red);
    border-radius:12px;
    margin:8px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .row{
    display:flex;
    gap:8px;
  }
  input[type="text"], input[type="number"]{
    flex:1;
    min-width:0;
    padding:10px 12px;
    border:2px solid var(--border);
    border-radius:10px;
    font-size:15px;
    background:#3f3f3f;
    color:var(--text);
  }
  input:focus{
    outline:2px solid var(--blue);
    outline-offset:1px;
    background:#4a4a4a;
  }
  button{
    border:none;
    border-radius:10px;
    padding:10px 14px;
    font-size:14px;
    font-weight:600;
    color:#fff;
    cursor:pointer;
    white-space:nowrap;
    transition:filter .15s ease, transform .05s ease;
  }
  button:active{ transform:scale(0.97); }
  #controls button:focus,
  #controls button:active{
    outline:3px solid var(--red);
    outline-offset:2px;
  }
  .leaflet-control a:focus,
  .leaflet-control a:active{
    outline:none !important;
  }
  .btn-blue{ background:var(--blue); }
  .btn-blue:hover{ background:var(--blue-dark); }
  .btn-blue-full{ background:var(--blue); width:100%; }
  .btn-blue-full:hover{ background:var(--blue-dark); }
  .btn-red{ background:var(--red); width:100%; }
  .btn-red:hover{ background:var(--red-dark); }
  .btn-yellow{ background:var(--yellow); }
  .btn-yellow:hover{ background:var(--yellow-dark); }
  .btn-orange{ background:var(--orange); }
  .btn-orange:hover{ background:var(--orange-dark); }
  .btn-green{ background:var(--green); width:100%; }
  .btn-green:hover{ background:var(--green-dark); }
  .btn-green.active{ background:var(--green-dark); box-shadow:0 0 0 3px rgba(22,163,74,.25) inset; }
  .gps-row input{ text-align:center; }
  #map{
    flex:1;
    min-height:0;
    width:100%;
  }
  .actions-row{
    display:flex;
    gap:8px;
  }
  .actions-row button{ flex:1; }
  @media (min-width:700px){
    header h1{ font-size:20px; }
    #controls{ padding:12px 24px 14px; }
    header{ padding:16px 24px 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📍 Géolocalisation</h1>
    <div id="status">Prêt.</div>
  </header>

  <div id="controls">
    <div class="row">
      <button type="button" class="btn-blue-full" id="btnLocate">🔵 Me géolocaliser</button>
    </div>

    <div class="row">
      <input type="text" id="addressInput" placeholder="Rechercher une adresse…">
      <button type="button" class="btn-blue" id="btnSearchAddress">Chercher</button>
    </div>

    <div class="row gps-row">
      <input type="number" step="any" id="latInput" placeholder="Latitude">
      <input type="number" step="any" id="lngInput" placeholder="Longitude">
      <button type="button" class="btn-blue" id="btnSearchGPS">Chercher</button>
    </div>

    <div class="actions-row">
      <button type="button" class="btn-red" id="btnClear">🔴 Effacer</button>
      <button type="button" class="btn-green" id="btnTrack">🟢 Suivi de localisation</button>
    </div>

    <div class="actions-row">
      <button type="button" class="btn-yellow" id="btnLock">🔓 Bloquer</button>
      <button type="button" class="btn-blue" id="btnSMS">✉️ Envoyer SMS</button>
      <button type="button" class="btn-orange" id="btnItinerary">🗺️ Itinéraire</button>
    </div>
  </div>

  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
  const map = L.map('map', { zoomControl: true }).setView([46.6034, 1.8883], 6);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  function pinIcon(color){
    return L.divIcon({
      className: '',
      html: `<svg width="30" height="42" viewBox="0 0 30 42" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 0C6.7 0 0 6.7 0 15c0 10.5 15 27 15 27s15-16.5 15-27C30 6.7 23.3 0 15 0z" fill="${color}"/>
        <circle cx="15" cy="15" r="6" fill="#fff"/>
      </svg>`,
      iconSize: [30, 42],
      iconAnchor: [15, 42],
      popupAnchor: [0, -38]
    });
  }
  const blueIcon = pinIcon('#2563eb');
  const redIcon = pinIcon('#dc2626');

  // Active les pseudo-classes :active/:focus au toucher sur iOS Safari
  document.body.addEventListener('touchstart', function(){}, { passive: true });

  let currentMarker = null;
  let trackMarker = null;
  let watchId = null;
  let tracking = false;

  const statusEl = document.getElementById('status');
  function setStatus(msg){ statusEl.textContent = msg; }

  let markerLocked = false;

  function placeBlueMarker(lat, lng, label){
    if(currentMarker) map.removeLayer(currentMarker);
    currentMarker = L.marker([lat, lng], { icon: blueIcon, draggable: !markerLocked }).addTo(map);
    if(label) currentMarker.bindPopup(label).openPopup();
    currentMarker.on('dragend', () => {
      const p = currentMarker.getLatLng();
      setStatus(`Position déplacée : ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`);
    });
    map.setView([lat, lng], 17);
  }

  // Appui long sur la carte pour déplacer le point bleu (évite les déplacements accidentels)
  let pressTimer = null;
  let pressStartLatLng = null;
  let pressStartPoint = null;

  function moveMarkerTo(latlng){
    if(markerLocked) return;
    if(!currentMarker){
      placeBlueMarker(latlng.lat, latlng.lng);
      return;
    }
    currentMarker.setLatLng(latlng);
    setStatus(`Position déplacée : ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`);
  }

  const mapContainer = map.getContainer();

  function startPress(latlng, point){
    if(markerLocked) return;
    pressStartLatLng = latlng;
    pressStartPoint = point;
    pressTimer = setTimeout(() => {
      if(pressStartLatLng) moveMarkerTo(pressStartLatLng);
      pressStartLatLng = null;
    }, 250);
  }
  function movePress(point){
    if(!pressTimer || !pressStartPoint) return;
    const dx = point.x - pressStartPoint.x;
    const dy = point.y - pressStartPoint.y;
    if(Math.sqrt(dx*dx + dy*dy) > 15){
      clearTimeout(pressTimer);
      pressTimer = null;
      pressStartLatLng = null;
    }
  }
  function endPress(){
    if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    pressStartLatLng = null;
  }

  mapContainer.addEventListener('touchstart', (e) => {
    const target = e.target;
    if(target && target.closest && target.closest('.leaflet-marker-icon')) return;
    const t = e.touches[0];
    const rect = mapContainer.getBoundingClientRect();
    const point = L.point(t.clientX - rect.left, t.clientY - rect.top);
    startPress(map.containerPointToLatLng(point), point);
  }, { passive: true });
  mapContainer.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    const rect = mapContainer.getBoundingClientRect();
    movePress(L.point(t.clientX - rect.left, t.clientY - rect.top));
  }, { passive: true });
  mapContainer.addEventListener('touchend', endPress, { passive: true });
  mapContainer.addEventListener('touchcancel', endPress, { passive: true });

  map.on('mousedown', (e) => {
    const target = e.originalEvent && e.originalEvent.target;
    if(target && target.closest && target.closest('.leaflet-marker-icon')) return;
    startPress(e.latlng, e.containerPoint);
  });
  map.on('mousemove', (e) => movePress(e.containerPoint));
  map.on('mouseup', endPress);

  function clearAll(){
    if(currentMarker){ map.removeLayer(currentMarker); currentMarker = null; }
    if(trackMarker){ map.removeLayer(trackMarker); trackMarker = null; }
    if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
    tracking = false;
    document.getElementById('btnTrack').classList.remove('active');
    markerLocked = false;
    document.getElementById('btnLock').textContent = '🔓 Bloquer la position';
    document.getElementById('addressInput').value = '';
    document.getElementById('latInput').value = '';
    document.getElementById('lngInput').value = '';
    setStatus('Effacé.');
    map.setView([46.6034, 1.8883], 6);
  }

  // Géolocalisation ponctuelle (avec repli si le mode haute précision expire)
  function locateOnce(){
    if(!navigator.geolocation){
      setStatus("La géolocalisation n'est pas supportée.");
      return;
    }
    setStatus('Localisation en cours…');
    navigator.geolocation.getCurrentPosition(
      pos => {
        const { latitude, longitude } = pos.coords;
        placeBlueMarker(latitude, longitude, 'Ma position');
        setStatus(`Position trouvée : ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
      },
      err => {
        if(err.code === err.TIMEOUT){
          setStatus('Nouvelle tentative (précision réduite)…');
          navigator.geolocation.getCurrentPosition(
            pos => {
              const { latitude, longitude } = pos.coords;
              placeBlueMarker(latitude, longitude, 'Ma position');
              setStatus(`Position trouvée : ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
            },
            err2 => setStatus("Erreur de géolocalisation : " + err2.message),
            { enableHighAccuracy: false, timeout: 30000, maximumAge: 60000 }
          );
        } else {
          setStatus("Erreur de géolocalisation : " + err.message);
        }
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }
  document.getElementById('btnLocate').addEventListener('click', locateOnce);

  // Recherche par adresse (Nominatim)
  async function searchAddress(){
    const q = document.getElementById('addressInput').value.trim();
    if(!q){ setStatus('Entrez une adresse.'); return; }
    setStatus('Recherche de l\'adresse…');
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
      const data = await res.json();
      if(data.length === 0){ setStatus('Adresse introuvable.'); return; }
      const { lat, lon, display_name } = data[0];
      placeBlueMarker(parseFloat(lat), parseFloat(lon), display_name);
      setStatus('Adresse trouvée.');
    }catch(e){
      setStatus('Erreur lors de la recherche.');
    }
  }
  document.getElementById('btnSearchAddress').addEventListener('click', searchAddress);
  document.getElementById('addressInput').addEventListener('keydown', e => { if(e.key === 'Enter') searchAddress(); });

  // Recherche par point GPS
  function searchGPS(){
    const lat = parseFloat(document.getElementById('latInput').value);
    const lng = parseFloat(document.getElementById('lngInput').value);
    if(isNaN(lat) || isNaN(lng)){ setStatus('Coordonnées invalides.'); return; }
    placeBlueMarker(lat, lng, `${lat.toFixed(5)}, ${lng.toFixed(5)}`);
    setStatus('Point GPS affiché.');
  }
  document.getElementById('btnSearchGPS').addEventListener('click', searchGPS);

  // Effacer
  document.getElementById('btnClear').addEventListener('click', clearAll);

  // Bloquer / débloquer le déplacement du marqueur bleu
  document.getElementById('btnLock').addEventListener('click', () => {
    markerLocked = !markerLocked;
    const btn = document.getElementById('btnLock');
    btn.textContent = markerLocked ? '🔒 Débloquer la position' : '🔓 Bloquer la position';
    if(currentMarker){
      if(markerLocked) currentMarker.dragging.disable();
      else currentMarker.dragging.enable();
    }
    setStatus(markerLocked ? 'Position bloquée.' : 'Position déplaçable.');
  });

  // Envoi SMS avec la position du marqueur bleu
  document.getElementById('btnSMS').addEventListener('click', () => {
    if(!currentMarker){ setStatus('Aucune position à envoyer.'); return; }
    const p = currentMarker.getLatLng();
    const text = `Ma position : https://maps.google.com/?q=${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
    window.location.href = `sms:?body=${encodeURIComponent(text)}`;
  });

  // Itinéraire vers la position du marqueur bleu
  document.getElementById('btnItinerary').addEventListener('click', () => {
    if(!currentMarker){ setStatus('Aucune position pour l\'itinéraire.'); return; }
    const p = currentMarker.getLatLng();
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${p.lat.toFixed(5)},${p.lng.toFixed(5)}`, '_blank');
  });

  // Suivi de localisation (pic rouge qui suit)
  document.getElementById('btnTrack').addEventListener('click', () => {
    const btn = document.getElementById('btnTrack');
    if(!tracking){
      if(!navigator.geolocation){ setStatus("La géolocalisation n'est pas supportée."); return; }
      tracking = true;
      btn.classList.add('active');
      setStatus('Suivi de localisation activé…');
      watchId = navigator.geolocation.watchPosition(
        pos => {
          const { latitude, longitude } = pos.coords;
          if(trackMarker){
            trackMarker.setLatLng([latitude, longitude]);
          } else {
            trackMarker = L.marker([latitude, longitude], { icon: redIcon }).addTo(map);
            map.setView([latitude, longitude], 17);
          }
          setStatus(`Suivi actif : ${latitude.toFixed(5)}, ${longitude.toFixed(5)}`);
        },
        err => setStatus("Erreur de suivi : " + err.message),
        { enableHighAccuracy: true, timeout: 30000, maximumAge: 10000 }
      );
    } else {
      tracking = false;
      btn.classList.remove('active');
      if(watchId !== null){ navigator.geolocation.clearWatch(watchId); watchId = null; }
      setStatus('Suivi de localisation arrêté.');
    }
  });
</script>
</body>
</html>
